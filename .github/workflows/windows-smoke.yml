name: Windows smoke test

# Verifies the Makefile parses and the no-arg targets run on Windows Git Bash.
# Does NOT touch Databricks (no auth, no deploy) — purely a portability check
# so that path/shell/printf assumptions don't drift away from Windows users.

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  makefile-smoke:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash    # = Git Bash on windows-latest; MSYSTEM=MINGW64
    steps:
      - uses: actions/checkout@v4

      # actions/checkout@v4 can leave CRLF in the working tree on the hosted
      # Windows image even though .gitattributes pins these paths to `eol=lf`
      # (a plain `git clone` honors the attribute and yields LF — verified).
      # Renormalize so the rest of the job runs against LF files exactly as a
      # real contributor's clone would, then the assertion below confirms it.
      - name: Enforce LF working tree (match a real git clone)
        run: |
          git config core.autocrlf false
          git config core.eol lf
          git rm --cached -rq .
          git reset --hard -q

      - name: Install GNU make
        shell: pwsh
        run: choco install make -y --no-progress

      - name: Show Git Bash environment
        run: |
          echo "MSYSTEM=$MSYSTEM"
          echo "SHELL=$SHELL"
          echo "HOME=$HOME"
          which bash
          which make
          make --version | head -1
          curl --version | head -1

      # Backstop: confirm the normalized working tree (and the committed blobs
      # it came from) are LF. Catches a shell script ever committed with CRLF
      # blobs, which .gitattributes cannot fix on checkout and which would break
      # `#!/usr/bin/env bash` + make recipes for every Windows contributor.
      - name: Assert LF line endings on shell-executed files
        run: |
          bad=$(git ls-files -- 'Makefile' '*.sh' '*.bash' | xargs -r grep -lU $'\r' || true)
          if [ -n "$bad" ]; then
            echo "::error::CRLF found in shell-executed files — Windows checkout corrupted them:"
            echo "$bad"
            exit 1
          fi
          echo "All Makefiles and shell scripts are LF."

      - name: make doctor
        run: make doctor

      - name: make info
        run: make info

      - name: make help
        run: make help
