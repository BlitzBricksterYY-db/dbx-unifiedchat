name: Windows smoke test

# Verifies the Makefile parses and the no-arg targets run on Windows Git Bash.
# Does NOT touch Databricks (no auth, no deploy) — purely a portability check
# so that path/shell/printf assumptions don't drift away from Windows users.

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  makefile-smoke:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash    # = Git Bash on windows-latest; MSYSTEM=MINGW64
    steps:
      - uses: actions/checkout@v4

      - name: Install GNU make
        shell: pwsh
        run: choco install make -y --no-progress

      - name: Show Git Bash environment
        run: |
          echo "MSYSTEM=$MSYSTEM"
          echo "SHELL=$SHELL"
          echo "HOME=$HOME"
          which bash
          which make
          make --version | head -1
          curl --version | head -1

      # Git for Windows defaults to core.autocrlf=true. If .gitattributes ever
      # stops pinning these to LF, the checkout corrupts them with CRLF and the
      # bash scripts the Makefile calls fail with "bad interpreter". The no-arg
      # targets below don't invoke those scripts, so guard the regression here.
      - name: Assert LF line endings on shell-executed files
        run: |
          bad=$(git ls-files -- 'Makefile' '*.sh' '*.bash' | xargs -r grep -lU $'\r' || true)
          if [ -n "$bad" ]; then
            echo "::error::CRLF found in shell-executed files — Windows checkout corrupted them:"
            echo "$bad"
            exit 1
          fi
          echo "All Makefiles and shell scripts are LF."

      - name: make doctor
        run: make doctor

      - name: make info
        run: make info

      - name: make help
        run: make help
