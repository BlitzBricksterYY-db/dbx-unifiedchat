name: Windows smoke test

# Verifies the Makefile parses and the no-arg targets run on Windows Git Bash.
# Does NOT touch Databricks (no auth, no deploy) — purely a portability check
# so that path/shell/printf assumptions don't drift away from Windows users.

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  makefile-smoke:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash    # = Git Bash on windows-latest; MSYSTEM=MINGW64
    steps:
      - uses: actions/checkout@v4

      # actions/checkout@v4 can leave CRLF in the working tree on the hosted
      # Windows image even though .gitattributes pins these paths to `eol=lf`
      # (a plain `git clone` honors the attribute and yields LF — verified
      # locally). git-based renormalize (`reset --hard`) does NOT fix it: git
      # treats the CRLF files as unchanged after the clean filter and skips the
      # rewrite. Strip the CR directly so the `make` steps below run on LF
      # exactly as a real contributor's clone would.
      - name: Strip CR from working tree (checkout@v4 leaves CRLF on Windows)
        run: |
          git ls-files -- 'Makefile' '*.sh' '*.bash' '*.yml' '*.yaml' | while IFS= read -r f; do
            sed -i 's/\r$//' "$f"
          done

      - name: Install GNU make
        shell: pwsh
        run: choco install make -y --no-progress

      - name: Show Git Bash environment
        run: |
          echo "MSYSTEM=$MSYSTEM"
          echo "SHELL=$SHELL"
          echo "HOME=$HOME"
          which bash
          which make
          make --version | head -1
          curl --version | head -1

      # The real regression guard: check the COMMITTED BLOBS, not the working
      # tree. .gitattributes (eol=lf) + LF blobs is what guarantees every clone
      # gets LF — so the invariant to protect is "no shell blob has CRLF". This
      # is deterministic and immune to the checkout@v4 working-tree quirk above.
      # Catches a script ever committed with CRLF, which .gitattributes cannot
      # repair on checkout and which would break bash/make for Windows clones.
      - name: Assert committed blobs are LF
        run: |
          bad=""
          while IFS= read -r f; do
            cr=$(git cat-file blob ":$f" | grep -cU $'\r' || true)
            if [ "${cr:-0}" -gt 0 ]; then
              bad="$bad$f"$'\n'
            fi
          done < <(git ls-files -- 'Makefile' '*.sh' '*.bash')
          if [ -n "$bad" ]; then
            echo "::error::CRLF found in committed blobs (breaks bash/make on every Windows clone):"
            printf '%s' "$bad"
            exit 1
          fi
          echo "All shell-executed blobs are LF."

      - name: make doctor
        run: make doctor

      - name: make info
        run: make info

      - name: make help
        run: make help
